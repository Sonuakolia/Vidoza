<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Vidoza</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:99999}
#boot .box{text-align:center}.vlogo{width:64px;height:64px;border-radius:16px;background:#e11d48;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:auto}
#boot p{color:#666}.app{display:none;min-height:100vh}
.top{height:58px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:20}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px}.mark{width:32px;height:32px;border-radius:9px;background:#e11d48;color:#fff;display:grid;place-items:center}
.spacer{flex:1}.icon{border:0;background:none;font-size:21px;padding:8px}
.page{display:none;padding-bottom:80px}.page.active{display:block}
.chips{display:flex;gap:8px;overflow:auto;padding:11px}.chip{border:0;background:#eee;border-radius:18px;padding:8px 13px;white-space:nowrap}.chip.active{background:#111;color:#fff}
.card{margin-bottom:16px}.thumb{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#111,#555);color:#fff;display:grid;place-items:center;font-size:48px;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:8px;bottom:8px;background:#000c;color:#fff;padding:3px 6px;border-radius:4px;font-size:12px}
.meta{display:flex;gap:10px;padding:9px 12px}.avatar{width:40px;height:40px;min-width:40px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-weight:700}.title{font-weight:700}.sub{font-size:13px;color:#6b7280;margin-top:4px}
.nav{position:fixed;left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:30}.nav button{flex:1;border:0;background:#fff;font-size:11px}.nav b{display:block;font-size:21px;margin-bottom:3px}.nav .plus b{font-size:29px}
.section{padding:16px}.h1{font-size:24px;font-weight:800;margin:0 0 16px}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}.btn{border:0;border-radius:20px;padding:10px 16px;font-weight:700}.primary{background:#e11d48;color:#fff}.soft{background:#eee}.divider{height:1px;background:#e5e7eb;margin:15px 0}.row{display:flex;align-items:center;gap:10px}.menu button{width:100%;padding:15px 6px;background:#fff;border:0;border-bottom:1px solid #eee;text-align:left;font-size:16px}
.actions{display:flex;gap:8px;overflow:auto;padding:10px 12px}.action{border:0;background:#eee;border-radius:18px;padding:9px 13px;min-width:75px}
.empty{text-align:center;color:#777;padding:35px}.short{height:calc(100vh - 140px);background:#111;color:#fff;position:relative;display:grid;place-items:center;overflow:hidden}.short video{width:100%;height:100%;object-fit:cover}.shortCaption{position:absolute;left:14px;bottom:16px;right:80px}.shortRail{position:absolute;right:10px;bottom:16px;display:grid;gap:10px}.shortRail button{width:46px;height:46px;border:0;border-radius:50%;background:#ffffff22;color:#fff}
#auth{display:none;position:fixed;inset:0;background:#f7f7f8;z-index:5000;align-items:center;justify-content:center;padding:18px}.authCard{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 40px #0002}.authInput{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:6px 0 11px}.authMsg{text-align:center;min-height:20px;font-size:14px;margin:10px 0}.link{border:0;background:none;color:#e11d48;font-weight:700}
.notice{background:#fff3cd;color:#664d03;padding:10px;border-radius:9px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="vlogo">V</div><h2>Vidoza</h2><p id="bootText">Loading…</p></div></div>

<div id="auth">
 <div class="authCard">
  <div style="text-align:center"><div class="vlogo">V</div><h1>Vidoza</h1><div style="color:#777">India's video platform</div></div>
  <div id="loginBox">
   <h2>Welcome back</h2>
   <input id="loginEmail" class="authInput" type="email" placeholder="Email address">
   <input id="loginPassword" class="authInput" type="password" placeholder="Password">
   <button class="btn primary" style="width:100%;border-radius:10px" id="loginBtn">Login</button>
   <div id="loginMsg" class="authMsg"></div>
   <p style="text-align:center;color:#666">Don't have an account? <button class="link" id="showSignup">Create account</button></p>
  </div>
  <div id="signupBox" style="display:none">
   <h2>Create account</h2>
   <input id="signupName" class="authInput" placeholder="Full name">
   <input id="signupEmail" class="authInput" type="email" placeholder="Email address">
   <input id="signupPassword" class="authInput" type="password" placeholder="Password (6+ characters)">
   <button class="btn primary" style="width:100%;border-radius:10px" id="signupBtn">Create account</button>
   <div id="signupMsg" class="authMsg"></div>
   <p style="text-align:center;color:#666">Already have an account? <button class="link" id="showLogin">Login</button></p>
  </div>
 </div>
</div>

<div class="app" id="app">
 <div class="top"><div class="logo"><span class="mark">V▶</span>Vidoza</div><div class="spacer"></div><button class="icon" id="searchBtn">⌕</button><button class="icon" id="settingsBtn">⚙</button></div>

 <div id="home" class="page active"><div id="chips" class="chips"></div><div id="feed"></div></div>

 <div id="shorts" class="page"><div class="section row" style="justify-content:space-between"><div class="h1" style="margin:0">Shorts</div><button class="btn primary" id="createShortBtn">＋ Create Short</button></div><div id="shortFeed"></div></div>

 <div id="search" class="page section"><div class="row"><input id="searchInput" class="field" style="margin:0" placeholder="Search Vidoza"><button class="btn primary" id="searchGo">Search</button></div><div id="searchResults"></div></div>

 <div id="upload" class="page section"><div class="h1">Upload video</div><div class="notice">Select a video and publish it. Upload status will be shown below.</div><input id="videoFile" class="field" type="file" accept="video/*"><input id="thumbFile" class="field" type="file" accept="image/*"><input id="uploadTitle" class="field" placeholder="Video title"><textarea id="uploadDesc" class="field" rows="4" placeholder="Description"></textarea><select id="visibility" class="field"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select><button class="btn primary" id="uploadBtn">Upload & Publish</button><div id="uploadStatus" class="authMsg"></div></div>

 <div id="shortUpload" class="page section"><div class="h1">Create Short</div><input id="shortFile" class="field" type="file" accept="video/*"><input id="shortThumb" class="field" type="file" accept="image/*"><input id="shortTitle" class="field" placeholder="Short title"><textarea id="shortDesc" class="field" rows="4" placeholder="Description"></textarea><button class="btn primary" id="shortUploadBtn">Upload Short</button><div id="shortStatus" class="authMsg"></div></div>

 <div id="you" class="page section"><div class="h1">You</div><div id="account"></div><div class="divider"></div><div class="menu"><button id="historyBtn">◷ History</button><button id="savedBtn">▣ Saved videos</button><button id="likedBtn">♥ Liked videos</button><button id="channelBtn">▤ Your channel</button><button id="youShortBtn">＋ Create Short</button><button id="youSettingsBtn">⚙ Settings</button><button id="logoutBtn" style="color:#e11d48;font-weight:700">🚪 Logout</button></div><div id="youList"></div></div>

 <div id="channel" class="page section"><div class="h1">Your channel</div><div id="channelAccount"></div><div class="divider"></div><div id="channelVideos"></div></div>

 <div id="player" class="page"></div>

 <div id="settings" class="page section"><div class="h1">Settings</div><div class="menu"><button id="privacyBtn">🔒 Privacy Policy</button><button id="termsBtn">📄 Terms</button><button id="guidelinesBtn">🛡 Community Guidelines</button><button id="supportBtn">🎧 Help & Support</button><button id="settingsLogout">🚪 Logout</button></div></div>

 <div id="support" class="page section"><div class="h1">Help & Support</div><input id="supportContact" class="field" placeholder="Email / Mobile"><textarea id="supportText" class="field" rows="6" placeholder="Describe your problem"></textarea><button class="btn primary" id="supportSubmit">Submit Ticket</button><div id="supportStatus" class="authMsg"></div></div>

 <div id="policy" class="page section"><div id="policyContent"></div></div>

 <div class="nav"><button id="navHome"><b>⌂</b>Home</button><button id="navShorts"><b>♬</b>Shorts</button><button class="plus" id="navCreate"><b>⊕</b>Create</button><button id="navSubs"><b>▣</b>Subscriptions</button><button id="navYou"><b>◉</b>You</button></div>
</div>

<script>
(function(){
'use strict';

const SUPABASE_URL='https://mhjtlxxgeepmbxeoravu.supabase.co';
const SUPABASE_KEY='sb_publishable_gHUxa_Mrg3UKzhjq9Rr30g_45Mqfex6';

let db=null,user=null,current='home',stack=['home'],selected=null,category='All';
let videos=JSON.parse(localStorage.getItem('vidozaVideosSafe')||'null')||[
 {id:'demo1',title:'Welcome to Vidoza',channel:'Vidoza Official',views:'12K views',age:'Today',category:'Learning',description:'Welcome to Vidoza.',liked:false,saved:false,subscribed:false},
 {id:'demo2',title:'Vidoza Music India',channel:'Vidoza Music',views:'5.1K views',age:'Today',category:'Music',description:'Music on Vidoza.',liked:false,saved:false,subscribed:false},
 {id:'demo3',title:'Creator News',channel:'Vidoza News',views:'8.4K views',age:'1 day ago',category:'News',description:'Latest creator stories.',liked:false,saved:false,subscribed:false}
];
let shorts=JSON.parse(localStorage.getItem('vidozaShortsSafe')||'[]');
function $(id){return document.getElementById(id)}
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){localStorage.setItem('vidozaVideosSafe',JSON.stringify(videos));localStorage.setItem('vidozaShortsSafe',JSON.stringify(shorts))}
function toast(t){alert(t)}
function showPage(id,push){
 document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
 if($(id))$(id).classList.add('active');
 if(push!==false&&stack[stack.length-1]!==id)stack.push(id);
 current=id;window.scrollTo(0,0);
 if(id==='home')renderHome();if(id==='shorts')renderShorts();if(id==='you')renderAccount();if(id==='channel')renderChannel();
}
window.appBack=function(){if(stack.length>1){stack.pop();showPage(stack[stack.length-1],false);return'handled'}if(current!=='home'){stack=['home'];showPage('home',false);return'handled'}return'exit'};

function renderChips(){
 const cats=['All','Music','News','Gaming','Learning','Live'];
 $('chips').innerHTML=cats.map(function(c){return '<button class="chip '+(category===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>'}).join('');
 document.querySelectorAll('[data-cat]').forEach(function(b){b.onclick=function(){category=b.dataset.cat;renderChips();renderHome()}})
}
function card(v){
 return '<div class="card" data-video="'+esc(v.id)+'"><div class="thumb">'+(v.thumbnail?'<img src="'+esc(v.thumbnail)+'">':'▶')+'<span class="duration">'+(v.isShort?'SHORT':'4:20')+'</span></div><div class="meta"><div class="avatar">'+esc((v.channel||'V')[0])+'</div><div><div class="title">'+esc(v.title)+'</div><div class="sub">'+esc(v.channel)+' · '+esc(v.views||'0 views')+' · '+esc(v.age||'Just now')+'</div></div></div></div>'
}
function bindCards(root){root.querySelectorAll('[data-video]').forEach(function(x){x.onclick=function(){openVideo(x.dataset.video)}})}
function renderHome(){
 renderChips();
 let list=category==='All'?videos:videos.filter(function(v){return v.category===category});
 $('feed').innerHTML=list.filter(function(v){return !v.isShort}).map(card).join('')||'<div class="empty">No videos in '+esc(category)+' yet.</div>';
 bindCards($('feed'));renderChannel()
}
function renderShorts(){
 $('shortFeed').innerHTML=shorts.length?shorts.map(function(v){return '<div class="short">'+(v.url?'<video controls playsinline src="'+esc(v.url)+'"></video>':'<div style="font-size:70px">▶</div>')+'<div class="shortCaption"><b>'+esc(v.channel)+'</b><br>'+esc(v.title)+'</div><div class="shortRail"><button data-like-short="'+esc(v.id)+'">♥</button><button data-comment-short="'+esc(v.id)+'">💬</button><button data-share-short="'+esc(v.id)+'">↗</button><button data-save-short="'+esc(v.id)+'">▣</button></div></div>'}).join(''):'<div class="empty">No Shorts yet. Tap Create Short.</div>';
 document.querySelectorAll('[data-share-short]').forEach(function(b){b.onclick=function(){shareText('Vidoza Short')}})
}
function renderAccount(){
 let name=user?(user.user_metadata&&user.user_metadata.full_name)||user.email.split('@')[0]:'Vidoza User';
 $('account').innerHTML='<div class="row"><div class="avatar">'+esc(name[0].toUpperCase())+'</div><div><b>'+esc(name)+'</b><div class="sub">'+esc(user?user.email:'')+'</div></div></div>';
 $('channelAccount').innerHTML=$('account').innerHTML;
}
function renderChannel(){
 if($('channelVideos'))$('channelVideos').innerHTML=videos.filter(function(v){return v.uploaded&&!v.isShort}).map(card).join('')||'<div class="empty">Your uploaded videos will appear here.</div>';
 if($('channelVideos'))bindCards($('channelVideos'))
}
function openVideo(id){
 selected=videos.find(function(v){return String(v.id)===String(id)});
 if(!selected)return;
 let media=selected.url?'<video controls playsinline autoplay style="width:100%;aspect-ratio:16/9;background:#000" src="'+esc(selected.url)+'"></video>':'<div class="thumb">▶</div>';
 $('player').innerHTML=media+'<div class="section"><div class="title">'+esc(selected.title)+'</div><div class="sub">'+esc(selected.views||'0 views')+' · '+esc(selected.category||'All')+'</div></div><div class="actions"><button class="action" id="likeAction">♥<br><span>'+(selected.liked?'Liked':'Like')+'</span></button><button class="action" id="commentAction">💬<br>Comment</button><button class="action" id="shareAction">↗<br>Share</button><button class="action" id="saveAction">▣<br><span>'+(selected.saved?'Saved':'Save')+'</span></button></div><div class="section"><div class="row"><div class="avatar">'+esc((selected.channel||'V')[0])+'</div><div style="flex:1"><b>'+esc(selected.channel)+'</b></div><button class="btn '+(selected.subscribed?'soft':'primary')+'" id="subAction">'+(selected.subscribed?'Subscribed':'Subscribe')+'</button></div><div class="divider"></div><b>Description</b><p>'+esc(selected.description)+'</p></div>';
 showPage('player');
 $('likeAction').onclick=toggleLike;$('saveAction').onclick=toggleSave;$('shareAction').onclick=function(){shareText(selected.title)};$('subAction').onclick=toggleSubscribe;$('commentAction').onclick=function(){toast('Comments can be added after backend tables are connected.')};
}
function toggleLike(){if(!user){toast('Please login first');return}selected.liked=!selected.liked;save();openVideo(selected.id)}
function toggleSave(){if(!user){toast('Please login first');return}selected.saved=!selected.saved;save();openVideo(selected.id)}
function toggleSubscribe(){if(!user){toast('Please login first');return}selected.subscribed=!selected.subscribed;save();openVideo(selected.id)}
function shareText(title){
 try{
  if(window.Native&&Native.share){Native.share(title,'Watch on Vidoza: '+title);return}
  if(navigator.share){navigator.share({title:title,text:'Watch on Vidoza: '+title});return}
  if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){toast('Link copied')});return}
 }catch(e){}
 toast('Share is not available on this device');
}

function setupAuth(){
 $('showSignup').onclick=function(){$('loginBox').style.display='none';$('signupBox').style.display='block'};
 $('showLogin').onclick=function(){$('signupBox').style.display='none';$('loginBox').style.display='block'};
 $('loginBtn').onclick=login;
 $('signupBtn').onclick=signup;
}
function showAuth(){ $('auth').style.display='flex' }
function hideAuth(){ $('auth').style.display='none' }
async function login(){
 if(!db){$('loginMsg').textContent='Connection is not ready. Please try again.';return}
 let e=$('loginEmail').value.trim(),p=$('loginPassword').value;
 if(!e||!p){$('loginMsg').textContent='Enter email and password.';return}
 $('loginMsg').textContent='Logging in...';
 try{let r=await db.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;user=r.data.user;hideAuth();$('app').style.display='block';showPage('home',false);renderAccount()}catch(err){$('loginMsg').textContent=err.message||'Login failed'}}
async function signup(){
 if(!db){$('signupMsg').textContent='Connection is not ready.';return}
 let n=$('signupName').value.trim(),e=$('signupEmail').value.trim(),p=$('signupPassword').value;
 if(!n||!e||p.length<6){$('signupMsg').textContent='Enter name, email and 6+ character password.';return}
 $('signupMsg').textContent='Creating account...';
 try{let r=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});if(r.error)throw r.error;$('signupMsg').textContent='Account created. Check email if confirmation is enabled.';$('loginBox').style.display='block';$('signupBox').style.display='none'}catch(err){$('signupMsg').textContent=err.message||'Signup failed'}}
async function logout(){try{if(db)await db.auth.signOut()}catch(e){}user=null;showAuth();$('app').style.display='none';stack=['home'];current='home'}

function fileToData(file,cb){if(!file){cb('');return}let r=new FileReader();r.onload=function(){cb(r.result)};r.readAsDataURL(file)}
function uploadVideo(){
 if(!user){toast('Please login first');return}
 let f=$('videoFile').files[0],t=$('uploadTitle').value.trim();
 if(!f||!t){toast('Select video and title');return}
 $('uploadStatus').style.color='#111';$('uploadStatus').textContent='Preparing video…';
 fileToData(f,function(url){
  $('uploadStatus').textContent='Processing video…';
  let tf=$('thumbFile').files[0];
  fileToData(tf,function(th){
   videos.unshift({id:'local-'+Date.now(),title:t,channel:(user.user_metadata&&user.user_metadata.full_name)||user.email.split('@')[0],views:'0 views',age:'Just now',description:$('uploadDesc').value,category:'All',uploaded:true,url:url,thumbnail:th,isShort:false,liked:false,saved:false,subscribed:false});
   save();renderHome();$('uploadStatus').style.color='#16a34a';$('uploadStatus').textContent='Video added successfully.';setTimeout(function(){showPage('home')},700)
  })
 })
}
function uploadShort(){
 if(!user){toast('Please login first');return}
 let f=$('shortFile').files[0],t=$('shortTitle').value.trim();
 if(!f||!t){toast('Select Short video and title');return}
 $('shortStatus').textContent='Processing Short…';
 fileToData(f,function(url){
  let tf=$('shortThumb').files[0];
  fileToData(tf,function(th){
   shorts.unshift({id:'short-'+Date.now(),title:t,channel:(user.user_metadata&&user.user_metadata.full_name)||user.email.split('@')[0],url:url,thumbnail:th,description:$('shortDesc').value});
   save();renderShorts();$('shortStatus').style.color='#16a34a';$('shortStatus').textContent='Short added successfully.';setTimeout(function(){showPage('shorts')},700)
  })
 })
}
function policy(title,text){$('policyContent').innerHTML='<div class="h1">'+esc(title)+'</div><p style="line-height:1.7">'+esc(text)+'</p>';showPage('policy')}

function wire(){
 $('searchBtn').onclick=function(){showPage('search')};$('settingsBtn').onclick=function(){showPage('settings')};
 $('navHome').onclick=function(){showPage('home')};$('navShorts').onclick=function(){showPage('shorts')};$('navCreate').onclick=function(){showPage('upload')};$('navSubs').onclick=function(){toast('Subscriptions')};$('navYou').onclick=function(){showPage('you')};
 $('createShortBtn').onclick=function(){showPage('shortUpload')};$('searchGo').onclick=doSearch;
 $('uploadBtn').onclick=uploadVideo;$('shortUploadBtn').onclick=uploadShort;
 $('logoutBtn').onclick=logout;$('settingsLogout').onclick=logout;
 $('channelBtn').onclick=function(){showPage('channel')};$('youShortBtn').onclick=function(){showPage('shortUpload')};$('youSettingsBtn').onclick=function(){showPage('settings')};
 $('historyBtn').onclick=function(){toast('History is available for videos opened on this device.')};$('savedBtn').onclick=function(){showSaved()};$('likedBtn').onclick=function(){showLiked()};
 $('privacyBtn').onclick=function(){policy('Privacy Policy','Vidoza uses account information to provide login and platform features.')};
 $('termsBtn').onclick=function(){policy('Terms of Service','Use Vidoza lawfully and upload only content you own or have permission to use.')};
 $('guidelinesBtn').onclick=function(){policy('Community Guidelines','Do not upload unlawful, abusive, deceptive, dangerous or rights-infringing content.')};
 $('supportBtn').onclick=function(){showPage('support')};$('supportSubmit').onclick=function(){$('supportStatus').textContent='Support ticket saved on this device.'};
}
function doSearch(){let q=$('searchInput').value.toLowerCase();let a=videos.filter(function(v){return (v.title+' '+v.channel).toLowerCase().indexOf(q)>=0});$('searchResults').innerHTML=a.map(card).join('')||'<div class="empty">No results</div>';bindCards($('searchResults'))}
function showSaved(){let a=videos.filter(function(v){return v.saved});$('youList').innerHTML=a.map(card).join('')||'<div class="empty">No saved videos yet.</div>';bindCards($('youList'))}
function showLiked(){let a=videos.filter(function(v){return v.liked});$('youList').innerHTML=a.map(card).join('')||'<div class="empty">No liked videos yet.</div>';bindCards($('youList'))}

async function boot(){
 setupAuth();wire();renderHome();renderShorts();
 $('bootText').textContent='Starting Vidoza…';
 try{
  if(window.supabase&&window.supabase.createClient){
   db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
   try{
    let r=await db.auth.getSession();
    if(r&&r.data&&r.data.session){user=r.data.session.user;$('app').style.display='block';renderAccount();hideAuth()}
   }catch(e){}
  }
 }catch(e){}
 $('boot').style.display='none';
 if(!user){$('app').style.display='block';showAuth()}
}
window.addEventListener('load',boot);
})();
</script>
</body>
</html>
